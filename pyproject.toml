[project]
name = "vocalgraph"
version = "0.1.0"
description = "Chart voices (pitch, resonance, loudness, breathiness), tell speakers apart, and cut the dead air out of recordings."
readme = "README.md"
# Pinned exactly in .python-version; uv installs that interpreter itself.
requires-python = "==3.13.*"
dependencies = [
    "flask",
    "imageio-ffmpeg",   # ships a static ffmpeg, so nobody installs it separately
    "numpy",
    "opensmile>=2.6.0",     # pitch, resonance, loudness, breathiness
    "onnxruntime",          # runs the two speaker models (no PyTorch needed)
    "scipy",                # clustering, exactly as pyannote does it
    "waitress",
    # Recording one app's sound on a Mac (ScreenCaptureKit). Mac only, so a
    # Windows install never downloads them.
    "pyobjc-framework-ScreenCaptureKit; sys_platform == 'darwin'",
    "pyobjc-framework-CoreMedia; sys_platform == 'darwin'",
    "pyobjc-framework-libdispatch; sys_platform == 'darwin'",
]

[tool.uv]
# An app run from its folder, not a library: no build step, no wheel.
package = false

[dependency-groups]
# Packaging the helper (helper/). Not installed by `uv sync` unless asked for
# with `--group helper`: only `dev` is a default group. The builds install it
# alone (`--only-group helper`), so it lists what the helper itself imports:
# on Windows only the standard library; on a Mac also ScreenCaptureKit's
# bindings and numpy (same versions as the app's, from uv.lock).
helper = [
    "pyinstaller==6.22.3",
    "numpy; sys_platform == 'darwin'",
    "pyobjc-framework-ScreenCaptureKit; sys_platform == 'darwin'",
    "pyobjc-framework-CoreMedia; sys_platform == 'darwin'",
    "pyobjc-framework-libdispatch; sys_platform == 'darwin'",
]
